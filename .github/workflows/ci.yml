# Rust fmt, clippy, and tests. Manual only, and Linux only.
#
# A push or pull request used to start ubuntu, macOS, and Windows. macOS
# minutes are billed at 10x and Windows at 2x. Run those locally when a
# platform check is needed. Start the Linux job by hand:
#
#   gh workflow run ci.yml --ref <branch>
name: Rust

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
